[dependencies]
core = "2.5.0"
promtracker = "1.0.1"
stable-trie = "https://github.com/research-ag/stable-trie#258baebb09188dd8d581960b72a210a4e8a25880" # "0.1.3", but with metrics
stable-log-lists = "https://github.com/research-ag/stable-log-lists.git#12d9acc1bb7bd12daa340a2a614632be9be27fa6" # first, unreleased, version

[dev-dependencies]
test = "2.1.2"

[toolchain]
moc = "1.6.0"
wasmtime = "42.0.0"

[canisters.metadata_directory]
main = "src/metadata_directory/main.mo"
candid = "src/metadata_directory/metadata_directory.did"
args = ["--enhanced-orthogonal-persistence"]

[canisters.history_be]
main = "src/history_be/main.mo"
candid = "src/history_be/history_be.did"
args = ["--enhanced-orthogonal-persistence", "--max-stable-pages", "131072"]

[canisters.history_be_2]
main = "src/history_be/main.mo"
candid = "src/history_be/history_be.did"
args = ["--enhanced-orthogonal-persistence", "--max-stable-pages", "131072"]